<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Full Body Logbook</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Logbook">
<meta name="theme-color" content="#0E1217">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone logbook — sticky header, scrolling day card, rest-timer dock above a fixed tab bar */
:root {
  --bg: #0E1217;
  --surface: #161B22;
  --surface-2: #1F262F;
  --line: #2A333E;
  --fg: #E9EDF2;
  --muted: #8C97A6;
  --accent: #F0B03A;
  --accent-ink: #1B1200;
  --accent-soft: rgba(240, 176, 58, .14);
  --good: #43B581;
  --bad: #E5534B;
  --scrim: rgba(4, 6, 9, .62);
  /* competition plate colours, used for RPE chips (same in both themes) */
  --plate-red: #D23B34;
  --plate-blue: #2C6CD4;
  --plate-yellow: #E6B62B;
  --plate-green: #2B9A58;
  --plate-white: #C9CED6;
  --on-plate: #FFFFFF;
  --on-yellow: #1B1200;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-body: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
  --tabs-h: 62px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F1F3F6; --surface: #FFFFFF; --surface-2: #E9EDF2; --line: #D5DBE3;
    --fg: #121820; --muted: #5A6573; --accent: #B47700; --accent-ink: #FFFFFF;
    --accent-soft: rgba(180, 119, 0, .12); --good: #1D8354; --bad: #C2352E;
    --scrim: rgba(18, 24, 32, .42); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F1F3F6; --surface: #FFFFFF; --surface-2: #E9EDF2; --line: #D5DBE3;
  --fg: #121820; --muted: #5A6573; --accent: #B47700; --accent-ink: #FFFFFF;
  --accent-soft: rgba(180, 119, 0, .12); --good: #1D8354; --bad: #C2352E;
  --scrim: rgba(18, 24, 32, .42); color-scheme: light;
}

* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
html, body { background: var(--bg); }
body {
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  padding-bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px) + 24px);
}
body.has-timer { padding-bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px) + 112px); }
body.noscroll { overflow: hidden; }
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.num { font-variant-numeric: tabular-nums; }

.gutter {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.col { max-width: 640px; margin: 0 auto; }

/* header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.top-in { display: flex; align-items: center; gap: 12px; padding-block: 12px; min-height: 60px; }
.top h1 {
  font-family: var(--font-display); font-weight: 700; font-size: 28px; letter-spacing: .01em;
  margin: 0; line-height: 1; flex: 1; min-width: 0; text-transform: uppercase;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.top .sub { color: var(--muted); font-size: 13px; margin-top: 2px; text-transform: none; font-family: var(--font-body); font-weight: 500; letter-spacing: 0; }
.sync-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.sync-dot.synced { background: var(--good); }
.sync-dot.offline { background: var(--accent); }

main { padding-block: 16px; display: flex; flex-direction: column; gap: 16px; }

/* generic pieces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.h2 { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.02; margin: 0; text-transform: uppercase; text-wrap: balance; }
.h3 { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.1; margin: 0; text-wrap: balance; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spacer { flex: 1; }
.stack { display: flex; flex-direction: column; gap: 8px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 16px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface-2); font-weight: 600; font-size: 15px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.big { min-height: 54px; font-size: 17px; width: 100%; font-family: var(--font-display); font-size: 22px; letter-spacing: .04em; text-transform: uppercase; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn.block { width: 100%; }
.iconbtn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid transparent; background: transparent; display: inline-grid; place-items: center; flex: none; }
.iconbtn:active, .btn:active { transform: translateY(1px); }

.chip {
  display: inline-flex; align-items: center; min-height: 34px; padding: 0 12px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface-2); font-size: 14px; font-weight: 600;
}
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; background: var(--surface-2); color: var(--muted); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.pill.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }

.notice { border: 1px dashed var(--accent); background: var(--accent-soft); border-radius: var(--r); padding: 12px 14px; font-size: 14px; }
.notice b { color: var(--fg); }

/* train home */
.daylist { display: flex; flex-direction: column; }
.dayrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: baseline; }
.dayrow:first-child { border-top: 0; }
.dayrow .nm { font-weight: 600; min-width: 0; }
.dayrow .tg { color: var(--muted); font-size: 13px; grid-column: 1; }
.dayrow .sw { font-family: var(--font-display); font-weight: 700; font-size: 20px; text-align: right; grid-row: 1 / span 2; grid-column: 2; align-self: center; }
.dayrow .sw small { font-family: var(--font-body); font-size: 12px; font-weight: 500; color: var(--muted); display: block; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.weekbar { display: flex; gap: 6px; }
.weekbar i { flex: 1; height: 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); }
.weekbar i.on { background: var(--accent); border-color: var(--accent); }

/* active workout */
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ex.complete { border-color: color-mix(in srgb, var(--good) 55%, var(--line)); }
.ex-head { display: flex; align-items: flex-start; gap: 8px; }
.ex-head .h3 { flex: 1; min-width: 0; padding-top: 8px; }
.ex-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.ex-meta b { color: var(--fg); font-weight: 600; }
.suggest { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; align-items: center; }
.suggest .w { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1; grid-row: 1 / span 2; }
.suggest .w small { font-size: 15px; color: var(--muted); font-weight: 600; margin-left: 2px; }
.suggest .why { font-size: 13px; font-weight: 600; min-width: 0; }
.suggest .why.up { color: var(--good); }
.suggest .why.down { color: var(--bad); }
.suggest .pl { font-size: 12px; color: var(--muted); min-width: 0; }
.last { font-size: 13px; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; }

.sets { display: flex; flex-direction: column; gap: 6px; }
.set, .set-head { display: grid; grid-template-columns: 30px minmax(0, 1fr) minmax(0, 1fr) 56px 48px; gap: 8px; align-items: center; }
.set-head { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 2px; }
.set-head span:nth-child(4), .set-head span:nth-child(5) { text-align: center; }
.set-n { font-family: var(--font-display); font-weight: 700; font-size: 20px; text-align: center; color: var(--muted); }
.in {
  width: 100%; min-width: 0; height: 46px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--fg); text-align: center;
  font-family: var(--font-display); font-weight: 600; font-size: 22px; font-variant-numeric: tabular-nums;
  -webkit-appearance: none; appearance: none;
}
.in::placeholder { color: var(--muted); opacity: .7; }
.rpe-btn { height: 46px; border-radius: 10px; border: 1px dashed var(--line); background: transparent; font-family: var(--font-display); font-weight: 700; font-size: 20px; color: var(--muted); padding: 0; }
.rpe-btn.has { border-style: solid; }
.chk { height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; padding: 0; }
.chk svg { width: 22px; height: 22px; stroke: var(--muted); }
.set.done .chk { background: var(--good); border-color: var(--good); }
.set.done .chk svg { stroke: #fff; }
.set.done .in { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.set.done .set-n { color: var(--good); }
.ex-foot { display: flex; gap: 8px; }
.ex-foot .btn { flex: 1; }

.p-red { background: var(--plate-red) !important; border-color: var(--plate-red) !important; color: var(--on-plate) !important; }
.p-blue { background: var(--plate-blue) !important; border-color: var(--plate-blue) !important; color: var(--on-plate) !important; }
.p-yellow { background: var(--plate-yellow) !important; border-color: var(--plate-yellow) !important; color: var(--on-yellow) !important; }
.p-green { background: var(--plate-green) !important; border-color: var(--plate-green) !important; color: var(--on-plate) !important; }

/* rest timer dock */
.timer {
  position: fixed; left: 0; right: 0; z-index: 7;
  bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px));
  padding-block: 8px;
}
.timer-in { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: 0 8px 28px rgba(0,0,0,.28); }
.timer-bar { height: 4px; background: var(--surface-2); }
.timer-bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s linear; }
.timer-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
.t-label { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-time { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.t-btns { display: flex; gap: 6px; flex: none; }
.t-btns .btn { min-height: 42px; padding: 0 12px; }
.timer.over .timer-in { border-color: var(--accent); }
.timer.over .t-time { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) {
  .timer.over .timer-in { animation: pulse 1.2s ease-in-out infinite; }
}
@keyframes pulse { 50% { box-shadow: 0 0 0 4px var(--accent-soft), 0 8px 28px rgba(0,0,0,.28); } }

/* tabs */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabs-in { display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tabs-h); }
.tab { background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.tab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab.on { color: var(--accent); }

/* history */
.hist { display: flex; flex-direction: column; gap: 10px; }
.hcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.hcard > button.hsum { width: 100%; text-align: left; background: none; border: 0; padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; }
.hsum .d { font-size: 13px; color: var(--muted); }
.hsum .t { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.1; }
.hsum .stats { grid-column: 2; grid-row: 1 / span 2; text-align: right; font-size: 13px; color: var(--muted); align-self: center; }
.hdetail { border-top: 1px solid var(--line); padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 10px; }
.hex .n { font-weight: 600; }
.hex .s { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.month { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 8px 2px 0; }

/* progress */
.plist { display: flex; flex-direction: column; }
.prow { width: 100%; background: none; border: 0; border-top: 1px solid var(--line); padding: 12px 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; text-align: left; align-items: center; }
.prow:first-child { border-top: 0; }
.prow .n { font-weight: 600; }
.prow .m { font-size: 13px; color: var(--muted); }
.prow .v { grid-column: 2; grid-row: 1 / span 2; font-family: var(--font-display); font-weight: 700; font-size: 24px; text-align: right; }
.prow .v small { display: block; font-family: var(--font-body); font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.stats3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 10px; min-width: 0; }
.stat .k { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.stat .v { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.1; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--font-body); }
.tablewrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
table.t th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); }
table.t td { padding: 8px 8px 8px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }

/* program */
.pday { display: flex; flex-direction: column; }
.pday-head { display: flex; align-items: center; gap: 8px; }
.pday-head .h3 { flex: 1; min-width: 0; }
.pex { width: 100%; background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; text-align: left; align-items: center; }
.pex .n { font-weight: 600; min-width: 0; }
.pex .m { font-size: 13px; color: var(--muted); }
.pex .chev { grid-column: 2; grid-row: 1 / span 2; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .lbl { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .03em; }
.field input, .field select, textarea.ta {
  width: 100%; min-width: 0; min-height: 44px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--fg); padding: 8px 12px; font: inherit; font-size: 17px;
}
textarea.ta { min-height: 260px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 14px; line-height: 1.5; resize: vertical; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.setting { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.setting:first-of-type { border-top: 0; }
.setting .l { flex: 1; min-width: 0; }
.setting .l small { display: block; color: var(--muted); font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex: none; }
.seg button { border: 0; background: transparent; min-height: 38px; min-width: 52px; padding: 0 12px; font-weight: 600; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.switch { width: 52px; height: 32px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); position: relative; flex: none; padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--muted); transition: transform .15s; }
.switch.on { background: var(--accent); border-color: var(--accent); }
.switch.on::after { transform: translateX(20px); background: var(--accent-ink); }
.mini-in { width: 84px; min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); text-align: center; font: inherit; font-size: 17px; flex: none; }
.err { color: var(--bad); font-size: 13px; white-space: pre-wrap; }

/* sheet */
#sheet-root { position: fixed; inset: 0; z-index: 20; }
.scrim { position: absolute; inset: 0; background: var(--scrim); }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 88%; overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: var(--surface); border-top-left-radius: 20px; border-top-right-radius: 20px; border: 1px solid var(--line); border-bottom: 0;
  padding-top: 8px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.sheet > * { width: 100%; max-width: 640px; margin-left: auto; margin-right: auto; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 4px; }
.rpe-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.rpe-opt { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 70px; justify-content: center; }
.rpe-opt b { font-family: var(--font-display); font-size: 28px; line-height: 1; }
.rpe-opt span { font-size: 11px; font-weight: 600; opacity: .9; text-align: center; }
.rpe-opt.sel { outline: 3px solid var(--fg); outline-offset: 1px; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.pr-list { display: flex; flex-direction: column; gap: 6px; }
.pr { display: flex; gap: 10px; align-items: baseline; font-size: 15px; }
.pr b { font-family: var(--font-display); font-size: 20px; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 30;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px;
  max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.25);
}
.empty { text-align: center; padding: 28px 12px; color: var(--muted); display: flex; flex-direction: column; gap: 8px; align-items: center; }

function chartSvg(sessions) {

  const W = 320, H = 170, L = 36, R = 10, T = 12, B = 24;

  const x = i => L + (W - L - R) * (pts.length === 1 ? 0.5 : i / (pts.length - 1));
  const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const ticks = [lo + pad, (lo + hi) / 2, hi - pad];
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.e1).toFixed(1)}`).join(' ');
  const area = `${line} L${x(pts.length - 1).toFixed(1)},${H - B} L${x(0).toFixed(1)},${H - B} Z`;
  const last = pts[pts.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Estimated 1RM over time">
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end">${Math.round(v)}</text>`).join('')}

    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.e1).toFixed(1)}" r="${i === pts.length - 1 ? 4.5 : 2.5}" fill="${i === pts.length - 1 ? 'var(--accent)' : 'var(--surface)'}" stroke="var(--accent)" stroke-width="1.5"/>`).join('')}

    <text x="${W - R}" y="${H - 6}" text-anchor="end">${esc(new Date(last.date).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }))}</text>
  </svg>`;

/* ---------- backup ---------- */
function backupJson() { return JSON.stringify({ app: 'full-body-logbook', version: 1, exportedAt: new Date().toISOString(), settings: S.settings, program: S.program, workouts: S.workouts }, null, 1); }
async function exportBackup() {
  const data = backupJson();
  const fname = 'logbook-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  openSheet(`<div class="h3">Export backup</div>
    <div class="muted small">Your program, settings and all ${S.workouts.length} workouts as JSON.</div>
    <button class="btn primary block" data-act="save-file">Save as file</button>
    <button class="btn block" data-act="copy">Copy to clipboard</button>
    <textarea class="ta" id="b-text" readonly style="min-height:140px">${esc(data)}</textarea>`,
    {
      'save-file': async () => {
        if (dl) { try { await dl.save({ filename: fname, data }); toast('Backup saved'); closeSheet(); } catch (e) { if (!e || e.code !== 'declined') toast('Couldn’t save the file here. Use Copy instead.'); } return; }
        const file = new File([data], fname, { type: 'application/json' });
        try {
          if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: fname }); closeSheet(); return; }
        } catch (e) { if (e && e.name === 'AbortError') return; }
        const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = fname;
        document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      },
      copy: el => {
        const ta = $('#b-text');
        try { navigator.clipboard.writeText(data).then(() => toast('Copied'), () => { ta.focus(); ta.select(); toast('Select all and copy'); }); }
        catch (e) { ta.focus(); ta.select(); toast('Select all and copy'); }
      }
    });
}

      go: () => {
        try {
          const d = JSON.parse($('#i-text').value);
          if (!d || !Array.isArray(d.workouts) || !d.program) throw new Error('missing');
          const have = new Set(S.workouts.map(w => w.id)); let added = 0;
          d.workouts.forEach(w => { if (w && w.id && !have.has(w.id)) { S.workouts.push(w); Sync.write('w-' + w.id, w, 0); added++; } });
          S.program = d.program; S.settings = { ...DEFAULT_SETTINGS, ...(d.settings || {}) };
          S.tombstones = S.tombstones.filter(id => !d.workouts.some(w => w.id === id));
          touchProfile(); closeSheet(); render(); toast(`Imported · ${added} new workout${added === 1 ? '' : 's'}`);
        } catch (e) { $('#i-err').textContent = 'That isn’t a Full Body Logbook backup. Check you copied all of it.'; }
      }
    });
  $('#i-file').addEventListener('change', ev => {
    const f = ev.target.files && ev.target.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => { $('#i-text').value = String(r.result || ''); }; r.readAsText(f);
  });
}

/* ---------- events ---------- */
const ACTS = {
  tab: el => { UI.tab = el.dataset.tab; UI.progKey = null; saveLocal(); render(); window.scrollTo(0, 0); },
  'sheet-close': () => closeSheet(),
  start: el => {
    const i = +el.dataset.i;
    if (S.active) return;
    startWorkout(i);
  },
  pickday: el => { UI.dayIdx = +el.dataset.i; render(); },
  check: el => {
    const row = el.closest('.set'); const ei = +row.dataset.ei, si = +row.dataset.si;
    const ex = S.active.exercises[ei]; const s = ex.sets[si];
    if (s.done) { s.done = false; persistActive(); render(); return; }
    if (num(s.w) == null) { const ph = weightPlaceholder(ex, si); s.w = ph != null ? String(ph) : ''; }
    if (num(s.reps) == null) {
      const prev = si > 0 ? num(ex.sets[si - 1].reps) : null;
      if (prev != null && ex.sets[si - 1].done) s.reps = String(prev);
      else { const inp = $('#r-' + ei + '-' + si); toast('Enter the reps you did first'); if (inp) inp.focus(); return; }
    }
    s.done = true; s.at = Date.now();
    persistActive();
    const allDone = S.active.exercises.every(e => e.sets.every(x => x.done));
    if (!allDone) startRest(ex.rest || S.settings.defaultRest, ex.name);
    render();
    if (S.settings.askRpe && (s.rpe === '' || s.rpe == null)) openRpeSheet(ei, si);
  },
  rpe: el => { const row = el.closest('.set'); openRpeSheet(+row.dataset.ei, +row.dataset.si); },
  'add-set': el => { const ex = S.active.exercises[+el.dataset.ei]; ex.sets.push({ w: '', reps: '', rpe: '', done: false }); persistActive(); render(); },
  'rest-now': el => { const ex = S.active.exercises[+el.dataset.ei]; startRest(ex.rest || S.settings.defaultRest, ex.name); },
  'ex-menu': el => exMenuSheet(+el.dataset.ei),
  'add-ex': () => addExerciseSheet(),
  finish: () => finishWorkout(),
  discard: () => confirmSheet('Discard this workout?', 'Every set logged in this session will be thrown away.', 'Discard', discardWorkout),
  't-adj': el => { if (!S.timer) return; const d = +el.dataset.d; if (S.timer.done) { S.timer.endsAt = Date.now() + Math.max(0, d) * 1000; S.timer.done = d <= 0; } else { S.timer.endsAt += d * 1000; S.timer.total = Math.max(5, S.timer.total + d); } saveLocal(); renderTimer(); },
  't-skip': () => { S.timer = null; saveLocal(); renderTimer(); },
  'open-w': el => { UI.openW = UI.openW === el.dataset.id ? null : el.dataset.id; render(); },
  'del-w': el => {
    const id = el.dataset.id;
    confirmSheet('Delete this workout?', 'It’s removed from history and records on every device. This can’t be undone.', 'Delete', () => {
      S.workouts = S.workouts.filter(w => w.id !== id); S.tombstones.push(id); Sync.write('w-' + id, null, 0); touchProfile(); render(); toast('Workout deleted');
    });
  },
  'prog-open': el => { UI.progKey = el.dataset.k; render(); window.scrollTo(0, 0); },
  'prog-back': () => { UI.progKey = null; render(); },
  'prog-text': () => programTextSheet(),
  'prog-meta': () => programMetaSheet(),
  'prog-restart': () => confirmSheet('Restart at week 1?', 'The week counter and day rotation start over. History and progression are kept.', 'Restart', () => { S.program.startedAt = Date.now(); touchProfile(); render(); toast('Back to week 1'); }),
  'day-edit': el => daySheet(+el.dataset.di),
  'day-add': () => daySheet(null),
  'ex-edit': el => exerciseSheet(+el.dataset.di, +el.dataset.xi),
  'ex-add': el => exerciseSheet(+el.dataset.di, null),
  unit: el => {
    const u = el.dataset.u; if (S.settings.unit === u) return;
    S.settings.unit = u;
    if (u === 'kg') { if (S.settings.bar === 45) S.settings.bar = 20; if (S.settings.round === 5) S.settings.round = 2.5; }
    else { if (S.settings.bar === 20) S.settings.bar = 45; if (S.settings.round === 2.5) S.settings.round = 5; }
    touchProfile(); render();
  },
  toggle: el => { const k = el.dataset.k; S.settings[k] = !S.settings[k]; touchProfile(); render(); if (k === 'awake') { S.settings.awake ? requestWake() : releaseWake(); } },
  export: () => exportBackup(),
  import: () => importBackup(),
  reset: () => confirmSheet('Reset everything?', 'Deletes your program, settings and all workout history on this device and in your account. Export a backup first if you might want it.', 'Reset everything', () => {
    for (const w of S.workouts) Sync.write('w-' + w.id, null, 0);
    S.workouts = []; S.active = null; S.timer = null; S.program = freshProgram(); S.settings = { ...DEFAULT_SETTINGS }; S.tombstones = [];
    touchProfile(); persistActive(); renderTimer(); render(); toast('Reset done');
  })
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (sheetActs[act] && el.closest('#sheet-root')) { sheetActs[act](el, ev); return; }
  if (ACTS[act]) ACTS[act](el, ev);
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.matches('.set .in')) {
    const row = el.closest('.set'); const ei = +row.dataset.ei, si = +row.dataset.si;
    const ex = S.active && S.active.exercises[ei]; if (!ex) return;
    ex.sets[si][el.dataset.f] = el.value.trim();
    // keep later sets' placeholders in step
    for (let j = si + 1; j < ex.sets.length; j++) {
      const wi = $('#w-' + ei + '-' + j); const ri = $('#r-' + ei + '-' + j);
      const wp = weightPlaceholder(ex, j); if (wi) wi.placeholder = wp != null ? fmtN(wp) : unitLbl();
      if (ri) ri.placeholder = repsPlaceholder(ex, j);
    }
    persistActive();
  } else if (el.id === 'w-notes' && S.active) { S.active.notes = el.value; persistActive(); }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.dataset && el.dataset.setting) {
    const k = el.dataset.setting; const v = num(el.value);
    if (v != null && v >= 0) { S.settings[k] = v; touchProfile(); } else el.value = S.settings[k];
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && !$('#sheet-root').hidden) closeSheet();
  if (ev.key === 'Enter' && ev.target.matches && ev.target.matches('.set .in')) {
    ev.preventDefault();
    const row = ev.target.closest('.set');
    if (ev.target.dataset.f === 'w') { const r = row.querySelector('[data-f="reps"]'); r && r.focus(); }
    else ev.target.blur();
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    requestWake(); renderTimer();
    if (Sync.col && Date.now() - Sync.lastPull > 30000 && !S.active) Sync.pull();
    else Sync.retryAll();
  }
});
window.addEventListener('online', () => Sync.retryAll());

/* ---------- setup link: #load=<base64url JSON> loads a program on this device only ---------- */
function importFromHash() {
  const m = location.hash.match(/^#load=([A-Za-z0-9_-]+)$/);
  if (!m) return;
  const clear = () => { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { location.hash = ''; } };
  let d;
  try {
    const b = atob(m[1].replace(/-/g, '+').replace(/_/g, '/'));
    d = JSON.parse(new TextDecoder().decode(Uint8Array.from(b, c => c.charCodeAt(0))));
  } catch (e) { clear(); toast('That setup link is incomplete. Copy the whole link and try again.'); return; }
  const { days, errors } = parseProgramText(d.text || '', S.settings.unit);
  if (errors.length || !days.length) { clear(); toast('That setup link has no program in it.'); return; }
  const apply = () => {
    S.program = { id: uid(), name: d.name || 'My program', isTemplate: false, weeks: d.weeks || null, perWeek: d.perWeek || days.length,
      deloadWeeks: d.deloadWeeks || [], deloadEvery: d.deloadEvery || null, startedAt: 0, days };
    touchProfile(); clear(); UI.tab = 'train'; render(); toast('Loaded ' + S.program.name);
  };
  if (S.program.isTemplate && !S.workouts.length) { apply(); return; }
  openSheet(`<div class="stack"><div class="h3">Load ${esc(d.name || 'this program')}?</div>
    <div class="muted">It replaces your current program (${esc(S.program.name)}). Logged workouts and records are kept.</div></div>
    <div class="row"><button class="btn spacer" data-act="no">Keep current</button><button class="btn primary spacer" data-act="yes">Load program</button></div>`,
    { yes: () => { closeSheet(); apply(); }, no: () => { closeSheet(); clear(); } });
}
window.addEventListener('hashchange', importFromHash);

/* ---------- boot ---------- */
loadLocal();
migrateTemplate();
render();
importFromHash();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { /* ignore */ }
if (S.timer) buildTimer();
if (S.active || S.timer) ensureTick();
if (S.active) requestWake();
Sync.init();
})();
</script>
</body>
